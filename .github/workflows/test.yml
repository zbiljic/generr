name: test

on:
  push:
    branches:
      - main
      - renovate/**
    tags:
      - v*
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
